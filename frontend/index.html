<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Appointment Booking</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      label { display:block; margin-top:8px }
    </style>
  </head>
  <body>
    <h1>Appointment Booking</h1>
    <form id="createForm">
      <label>Name <input id="name" required /></label>
      <label>Email <input id="email" type="email" required /></label>
      <label>Start <input id="start" type="datetime-local" required /></label>
      <label>End <input id="end" type="datetime-local" required /></label>
      <label>Notes <input id="notes" /></label>
      <button>Create</button>
    </form>
    <hr />
    <h2>Appointments</h2>
    <ul id="list"></ul>

    <script>
      const form = document.getElementById('createForm');
      const list = document.getElementById('list');

      async function load() {
        const r = await fetch('/appointments');
        const data = await r.json();
        list.innerHTML = data.map(a => `<li>${a.start_time} - ${a.end_time}: <strong>${a.name}</strong> (${a.email})</li>`).join('');
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          start_time: new Date(document.getElementById('start').value).toISOString(),
          end_time: new Date(document.getElementById('end').value).toISOString(),
          notes: document.getElementById('notes').value || null,
        };
        const r = await fetch('/appointments', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        if (r.ok) {
          form.reset();
          load();
        } else {
          const err = await r.json();
          alert('Error: ' + (err.detail || JSON.stringify(err)));
        }
      });

      load();
    </script>
  </body>
</html>
